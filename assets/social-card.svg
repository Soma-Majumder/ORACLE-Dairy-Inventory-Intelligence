<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">Dairy Inventory Alert Dashboard</title>
  <desc id="description">An AI-powered inventory dashboard that helps inventory coordinators monitor low stock, prevent stockouts, track expiration dates, and streamline reordering.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#e7eee1"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#6d634f" flood-opacity=".14"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#background)"/>
  <circle cx="1080" cy="42" r="210" fill="#dce7d6"/>
  <circle cx="62" cy="628" r="230" fill="#f8dfd8"/>
  <path d="M0 458C176 402 248 488 375 462C497 438 542 343 683 374C826 405 963 499 1200 404V630H0Z" fill="#eef3e9" opacity=".9"/>

  <rect x="60" y="60" width="1080" height="510" rx="30" fill="#fffdf9" filter="url(#shadow)"/>
  <rect x="108" y="113" width="5" height="80" rx="2.5" fill="#71856c"/>
  <text x="133" y="136" fill="#687a60" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="3.5">DAIRY OPERATIONS</text>

  <text x="108" y="249" fill="#393329" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="500">Dairy Inventory</text>
  <text x="108" y="326" fill="#393329" font-family="Georgia, 'Times New Roman', serif" font-size="70" font-weight="500">Alert Dashboard</text>

  <rect x="108" y="372" width="590" height="2" fill="#e8ddcd"/>
  <text x="108" y="424" fill="#746b5c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">An AI-powered inventory dashboard that helps inventory</text>
  <text x="108" y="460" fill="#746b5c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">coordinators monitor low stock, prevent stockouts, track</text>
  <text x="108" y="496" fill="#746b5c" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400">expiration dates, and streamline reordering.</text>

  <g transform="translate(788 148)">
    <circle cx="160" cy="160" r="151" fill="#edf3e9"/>
    <circle cx="160" cy="160" r="128" fill="#fffaf3" stroke="#dce7d6" stroke-width="4"/>
    <image href="cow.png" x="54" y="54" width="212" height="212" preserveAspectRatio="xMidYMid meet"/>
    <circle cx="54" cy="68" r="9" fill="#dba39d"/>
    <circle cx="272" cy="247" r="12" fill="#9bad8c"/>
  </g>

  <g transform="translate(108 529)">
    <circle cx="7" cy="7" r="7" fill="#71856c"/>
    <text x="24" y="13" fill="#687a60" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing=".8">STAY AHEAD OF EVERY SHELF</text>
  </g>
</svg>
